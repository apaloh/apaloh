<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Romantic Irma</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fond avec zoom flou */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('Ma irma.jpg') center center / cover no-repeat;
      z-index: -3;
      filter: blur(8px);
      animation: zoomInOut 20s ease-in-out infinite;
      transform: scale(1.1);
    }

    @keyframes zoomInOut {
      0% { transform: scale(1.1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1.1); }
    }

    .message {
      position: absolute;
      color: #ff69b4;
      font-size: 3rem;
      font-family: 'Courier New', monospace;
      animation: float 12s infinite ease-in-out;
      opacity: 0;
      z-index: 2;
    }

    @keyframes float {
      0% { transform: translateY(100px); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translateY(-30px); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-200px); opacity: 0; }
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Musique douce -->
  <audio id="bgm" autoplay loop>
    <source src="love.mp3" type="audio/mpeg">
    Ton navigateur ne supporte pas l’audio.
  </audio>

  <canvas id="heartRain"></canvas>

  <div class="message" id="text">Irma</div>

  <script>
    // Texte romantique animé
    const texts = ["Irma", "Bonne fête maman", "Je t’aime", "Bisou", "❤️"];
    let index = 0;
    const el = document.getElementById("text");

    function showNextText() {
      el.textContent = texts[index];
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = null;
      index = (index + 1) % texts.length;
    }

    showNextText();
    setInterval(showNextText, 4000);

    // Coeurs flous dessinés
    const canvas = document.getElementById("heartRain");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const hearts = [];
    for (let i = 0; i < 80; i++) {
      hearts.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 10 + Math.random() * 20,
        speed: 0.5 + Math.random() * 1.5,
        opacity: 0.3 + Math.random() * 0.5
      });
    }

    function drawHeart(x, y, size, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size / 20, size / 20);
      ctx.beginPath();
      ctx.globalAlpha = opacity;
      ctx.fillStyle = "rgba(255,105,180,0.6)";
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(0, -3, -5, -5, -5, -10);
      ctx.bezierCurveTo(-5, -15, 0, -18, 0, -12);
      ctx.bezierCurveTo(0, -18, 5, -15, 5, -10);
      ctx.bezierCurveTo(5, -5, 0, -3, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let h of hearts) {
        drawHeart(h.x, h.y, h.size, h.opacity);
        h.y += h.speed;
        if (h.y > canvas.height) {
          h.y = -20;
          h.x = Math.random() * canvas.width;
        }
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
